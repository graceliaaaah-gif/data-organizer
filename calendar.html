<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Calendar</title>
  <script src="navigation.js" defer></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .app {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px 15px 30px;
    }

    /* HEADER */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .calendar-title {
      margin: 0;
      font-size: 28px;
    }

    .month-navigation {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .month-navigation button,
    .today-button {
      border: 1px solid #ddd;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    .month-navigation button {
      width: 40px;
      height: 34px;
    }

    .month-navigation button:hover {
      background: #f0f0f0;
    }

    #monthYear {
      min-width: 160px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .today-button {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
      padding: 9px 15px;
      margin-bottom: 15px;
    }

    .today-button:hover {
      background: #1d4ed8;
    }

    /* CALENDAR */
    .calendar {
      width: 100%;
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: #fafafa;
    }

    .weekday {
      text-align: center;
      font-weight: bold;
      color: #666;
      padding: 13px 5px;
      border-bottom: 1px solid #eee;
    }

    /*
      IMPORTANT:
      The days container is also a 7-column grid.
    */
    #calendarDays {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      width: 100%;
    }

    .day {
      min-height: 130px;
      padding: 8px;
      border-right: 1px solid #eee;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      background: white;
    }

    .day:hover {
      background: #f8fafc;
    }

    .day:nth-child(7n) {
      border-right: none;
    }

    .day.other-month {
      background: #fafafa;
      color: #aaa;
    }

    .day.today {
      background: #eff6ff;
    }

    .day-number {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 30px;
      height: 30px;

      margin-bottom: 5px;

      border-radius: 50%;
      font-weight: bold;
    }

    .day.today .day-number {
      background: #2563eb;
      color: white;
    }

    /* EVENTS */

    .event {
      color: white;
      border-radius: 5px;
      padding: 5px 7px;
      margin-top: 4px;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .event:hover {
      opacity: 0.85;
    }

    .event-time {
      font-weight: bold;
      margin-right: 4px;
    }

    /* MODAL */

    .modal-overlay {
      position: fixed;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, 0.45);

      padding: 20px;

      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 450px;

      background: white;
      border-radius: 14px;

      padding: 25px;

      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }

    .modal h2 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .selected-date {
      color: #666;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px;

      border: 1px solid #d1d5db;
      border-radius: 7px;

      font-size: 15px;
      font-family: inherit;
    }

    .form-group textarea {
      min-height: 80px;
      resize: vertical;
    }

    .modal-buttons {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-buttons button {
      border: none;
      border-radius: 7px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
    }

    .cancel-button {
      background: #e5e7eb;
    }

    .save-button {
      background: #2563eb;
      color: white;
    }

    .delete-button {
      background: #dc2626;
      color: white;
      margin-right: auto;
    }

    .cancel-button:hover {
      background: #d1d5db;
    }

    .save-button:hover {
      background: #1d4ed8;
    }

    .delete-button:hover {
      background: #b91c1c;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .calendar-header {
        flex-direction: column;
        gap: 12px;
      }

      .calendar-title {
        font-size: 25px;
      }

      #monthYear {
        min-width: 140px;
        font-size: 18px;
      }

      .weekday {
        font-size: 12px;
      }

      .day {
        min-height: 90px;
        padding: 5px;
      }

      .day-number {
        width: 25px;
        height: 25px;
        font-size: 12px;
      }

      .event {
        font-size: 10px;
        padding: 3px;
      }
    }
  </style>
</head>

<body>
<site-navigation></site-navigation>
<div class="app">

  <div class="calendar-header">

    <h1 class="calendar-title">
      My Calendar
    </h1>

    <div class="month-navigation">

      <button id="prevMonth">
        ←
      </button>

      <div id="monthYear"></div>

      <button id="nextMonth">
        →
      </button>

    </div>

  </div>

  <button
    id="todayButton"
    class="today-button">
    Today
  </button>


  <!-- CALENDAR -->

  <div class="calendar">

    <div class="weekdays">

      <div class="weekday">Sun</div>
      <div class="weekday">Mon</div>
      <div class="weekday">Tue</div>
      <div class="weekday">Wed</div>
      <div class="weekday">Thu</div>
      <div class="weekday">Fri</div>
      <div class="weekday">Sat</div>

    </div>

    <!-- DAYS GET INSERTED HERE -->

    <div id="calendarDays"></div>

  </div>

</div>


<!-- EVENT MODAL -->

<div
  id="modalOverlay"
  class="modal-overlay">

  <div class="modal">

    <h2 id="modalTitle">
      Add Event
    </h2>

    <div
      id="selectedDate"
      class="selected-date">
    </div>


    <form id="eventForm">

      <div class="form-group">

        <label for="eventTitle">
          Event Title
        </label>

        <input
          id="eventTitle"
          type="text"
          placeholder="e.g. Meeting"
          required>

      </div>


      <div class="form-group">

        <label for="eventTime">
          Time
        </label>

        <input
          id="eventTime"
          type="time">

      </div>


      <div class="form-group">

        <label for="eventColor">
          Color
        </label>

        <select id="eventColor">

          <option value="#2563eb">
            Blue
          </option>

          <option value="#16a34a">
            Green
          </option>

          <option value="#dc2626">
            Red
          </option>

          <option value="#9333ea">
            Purple
          </option>

          <option value="#ea580c">
            Orange
          </option>

          <option value="#0891b2">
            Cyan
          </option>

        </select>

      </div>


      <div class="form-group">

        <label for="eventDescription">
          Description
        </label>

        <textarea
          id="eventDescription"
          placeholder="Optional description">
        </textarea>

      </div>


      <div class="modal-buttons">

        <button
          type="button"
          id="deleteButton"
          class="delete-button"
          style="display:none;">
          Delete
        </button>

        <button
          type="button"
          id="cancelButton"
          class="cancel-button">
          Cancel
        </button>

        <button
          type="submit"
          class="save-button">
          Save Event
        </button>

      </div>

    </form>

  </div>

</div>


<script>

document.addEventListener("DOMContentLoaded", function () {

  /*
   * ELEMENTS
   */

  const calendarDays =
    document.getElementById("calendarDays");

  const monthYear =
    document.getElementById("monthYear");

  const prevMonth =
    document.getElementById("prevMonth");

  const nextMonth =
    document.getElementById("nextMonth");

  const todayButton =
    document.getElementById("todayButton");

  const modalOverlay =
    document.getElementById("modalOverlay");

  const modalTitle =
    document.getElementById("modalTitle");

  const selectedDateElement =
    document.getElementById("selectedDate");

  const eventForm =
    document.getElementById("eventForm");

  const eventTitle =
    document.getElementById("eventTitle");

  const eventTime =
    document.getElementById("eventTime");

  const eventColor =
    document.getElementById("eventColor");

  const eventDescription =
    document.getElementById("eventDescription");

  const cancelButton =
    document.getElementById("cancelButton");

  const deleteButton =
    document.getElementById("deleteButton");


  /*
   * CURRENT MONTH
   */

  let currentDate = new Date();


  /*
   * SELECTED DATE
   */

  let selectedDate = null;


  /*
   * EVENT BEING EDITED
   */

  let editingEventId = null;


  /*
   * LOAD EVENTS SAFELY
   */

  let events = [];

  try {

    const savedEvents =
      localStorage.getItem("calendarEvents");

    if (savedEvents) {
      events = JSON.parse(savedEvents);
    }

    if (!Array.isArray(events)) {
      events = [];
    }

  } catch (error) {

    console.warn(
      "Could not load saved events.",
      error
    );

    events = [];
  }


  /*
   * SAVE EVENTS
   */

  function saveEvents() {

    try {

      localStorage.setItem(
        "calendarEvents",
        JSON.stringify(events)
      );

    } catch (error) {

      console.warn(
        "Could not save events.",
        error
      );
    }
  }


  /*
   * DATE → YYYY-MM-DD
   */

  function dateKey(date) {

    const year =
      date.getFullYear();

    const month =
      String(date.getMonth() + 1)
        .padStart(2, "0");

    const day =
      String(date.getDate())
        .padStart(2, "0");

    return `${year}-${month}-${day}`;
  }


  /*
   * DISPLAY DATE
   */

  function displayDate(dateString) {

    const date =
      new Date(
        dateString + "T00:00:00"
      );

    return date.toLocaleDateString(
      undefined,
      {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      }
    );
  }


  /*
   * FORMAT TIME
   */

  function formatTime(time) {

    if (!time) {
      return "";
    }

    const parts =
      time.split(":");

    let hour =
      parseInt(parts[0], 10);

    const minutes =
      parts[1];

    const suffix =
      hour >= 12 ? "PM" : "AM";

    hour =
      hour % 12 || 12;

    return `${hour}:${minutes} ${suffix}`;
  }


  /*
   * CREATE EVENT ID
   */

  function createId() {

    return Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2);
  }


  /*
   * RENDER CALENDAR
   */

  function renderCalendar() {

    /*
     * CLEAR OLD DAYS
     */

    calendarDays.innerHTML = "";


    const year =
      currentDate.getFullYear();

    const month =
      currentDate.getMonth();


    /*
     * MONTH TITLE
     */

    monthYear.textContent =
      currentDate.toLocaleDateString(
        undefined,
        {
          month: "long",
          year: "numeric"
        }
      );


    /*
     * FIRST DAY OF MONTH
     */

    const firstDay =
      new Date(
        year,
        month,
        1
      );


    /*
     * NUMBER OF DAYS
     */

    const daysInMonth =
      new Date(
        year,
        month + 1,
        0
      ).getDate();


    /*
     * DAY OF WEEK MONTH STARTS
     *
     * Sunday = 0
     * Monday = 1
     * ...
     */

    const startDay =
      firstDay.getDay();


    /*
     * PREVIOUS MONTH DAYS
     */

    const previousMonthDays =
      new Date(
        year,
        month,
        0
      ).getDate();


    for (
      let i = startDay - 1;
      i >= 0;
      i--
    ) {

      const day =
        previousMonthDays - i;

      const date =
        new Date(
          year,
          month - 1,
          day
        );

      createDay(
        date,
        true
      );
    }


    /*
     * CURRENT MONTH
     */

    for (
      let day = 1;
      day <= daysInMonth;
      day++
    ) {

      const date =
        new Date(
          year,
          month,
          day
        );

      createDay(
        date,
        false
      );
    }


    /*
     * NEXT MONTH
     */

    const totalCells =
      startDay + daysInMonth;

    const remaining =
      (7 - (totalCells % 7)) % 7;


    for (
      let day = 1;
      day <= remaining;
      day++
    ) {

      const date =
        new Date(
          year,
          month + 1,
          day
        );

      createDay(
        date,
        true
      );
    }

  }


  /*
   * CREATE INDIVIDUAL DAY
   */

  function createDay(
    date,
    otherMonth
  ) {

    const dayElement =
      document.createElement("div");

    dayElement.className =
      "day";


    /*
     * OTHER MONTH
     */

    if (otherMonth) {

      dayElement.classList.add(
        "other-month"
      );
    }


    /*
     * TODAY
     */

    const today =
      new Date();

    if (
      date.getFullYear() ===
        today.getFullYear() &&

      date.getMonth() ===
        today.getMonth() &&

      date.getDate() ===
        today.getDate()
    ) {

      dayElement.classList.add(
        "today"
      );
    }


    /*
     * DAY NUMBER
     */

    const number =
      document.createElement("div");

    number.className =
      "day-number";

    number.textContent =
      date.getDate();

    dayElement.appendChild(
      number
    );


    /*
     * EVENTS FOR THIS DAY
     */

    const key =
      dateKey(date);

    const dayEvents =
      events.filter(
        event =>
          event.date === key
      );


    /*
     * SORT EVENTS BY TIME
     */

    dayEvents.sort(
      function (a, b) {

        return (a.time || "")
          .localeCompare(
            b.time || ""
          );

      }
    );


    /*
     * DISPLAY EVENTS
     */

    dayEvents.forEach(
      function (event) {

        const eventElement =
          document.createElement("div");

        eventElement.className =
          "event";

        eventElement.style.background =
          event.color || "#2563eb";


        if (event.time) {

          const time =
            document.createElement("span");

          time.className =
            "event-time";

          time.textContent =
            formatTime(event.time);

          eventElement.appendChild(
            time
          );
        }


        const title =
          document.createElement("span");

        title.textContent =
          event.title;

        eventElement.appendChild(
          title
        );


        /*
         * EDIT EVENT
         */

        eventElement.addEventListener(
          "click",
          function (e) {

            e.stopPropagation();

            openEditEvent(event);
          }
        );


        dayElement.appendChild(
          eventElement
        );

      }
    );


    /*
     * CLICK DAY TO ADD EVENT
     */

    dayElement.addEventListener(
      "click",
      function () {

        openAddEvent(key);

      }
    );


    /*
     * ADD DAY TO CALENDAR
     */

    calendarDays.appendChild(
      dayElement
    );

  }


  /*
   * ADD EVENT
   */

  function openAddEvent(date) {

    selectedDate =
      date;

    editingEventId =
      null;

    modalTitle.textContent =
      "Add Event";

    selectedDateElement.textContent =
      displayDate(date);

    eventTitle.value =
      "";

    eventTime.value =
      "";

    eventColor.value =
      "#2563eb";

    eventDescription.value =
      "";

    deleteButton.style.display =
      "none";

    modalOverlay.classList.add(
      "active"
    );

    eventTitle.focus();
  }


  /*
   * EDIT EVENT
   */

  function openEditEvent(event) {

    selectedDate =
      event.date;

    editingEventId =
      event.id;

    modalTitle.textContent =
      "Edit Event";

    selectedDateElement.textContent =
      displayDate(event.date);

    eventTitle.value =
      event.title || "";

    eventTime.value =
      event.time || "";

    eventColor.value =
      event.color || "#2563eb";

    eventDescription.value =
      event.description || "";

    deleteButton.style.display =
      "block";

    modalOverlay.classList.add(
      "active"
    );

    eventTitle.focus();
  }


  /*
   * CLOSE MODAL
   */

  function closeModal() {

    modalOverlay.classList.remove(
      "active"
    );

    selectedDate =
      null;

    editingEventId =
      null;
  }


  /*
   * SAVE EVENT
   */

  eventForm.addEventListener(
    "submit",
    function (e) {

      e.preventDefault();


      const title =
        eventTitle.value.trim();


      if (!title) {
        return;
      }


      /*
       * EDIT
       */

      if (editingEventId) {

        const event =
          events.find(
            item =>
              item.id ===
              editingEventId
          );


        if (event) {

          event.title =
            title;

          event.time =
            eventTime.value;

          event.color =
            eventColor.value;

          event.description =
            eventDescription.value.trim();

        }

      }


      /*
       * NEW EVENT
       */

      else {

        events.push({

          id:
            createId(),

          date:
            selectedDate,

          title:
            title,

          time:
            eventTime.value,

          color:
            eventColor.value,

          description:
            eventDescription.value.trim()

        });

      }


      saveEvents();

      closeModal();

      renderCalendar();

    }
  );


  /*
   * DELETE EVENT
   */

  deleteButton.addEventListener(
    "click",
    function () {

      if (!editingEventId) {
        return;
      }


      if (
        !confirm(
          "Delete this event?"
        )
      ) {
        return;
      }


      events =
        events.filter(
          event =>
            event.id !==
            editingEventId
        );


      saveEvents();

      closeModal();

      renderCalendar();

    }
  );


  /*
   * CANCEL
   */

  cancelButton.addEventListener(
    "click",
    closeModal
  );


  /*
   * CLICK OUTSIDE MODAL
   */

  modalOverlay.addEventListener(
    "click",
    function (e) {

      if (
        e.target ===
        modalOverlay
      ) {

        closeModal();

      }

    }
  );


  /*
   * PREVIOUS MONTH
   */

  prevMonth.addEventListener(
    "click",
    function () {

      currentDate.setMonth(
        currentDate.getMonth() - 1
      );

      renderCalendar();

    }
  );


  /*
   * NEXT MONTH
   */

  nextMonth.addEventListener(
    "click",
    function () {

      currentDate.setMonth(
        currentDate.getMonth() + 1
      );

      renderCalendar();

    }
  );


  /*
   * TODAY
   */

  todayButton.addEventListener(
    "click",
    function () {

      currentDate =
        new Date();

      renderCalendar();

    }
  );


  /*
   * ESCAPE CLOSES MODAL
   */

  document.addEventListener(
    "keydown",
    function (e) {

      if (
        e.key === "Escape"
      ) {

        closeModal();

      }

    }
  );


  /*
   * INITIALIZE CALENDAR
   *
   * This is the important part.
   */

  renderCalendar();

});

</script>

</body>
</html>
