<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Sign Up Sheet</title>
        <style>
            body{font-family:Verdana, Tahoma, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 20px;
                height: 80vh;
                background-color:rgb(249, 216, 222);
            }
            .form{border:none;
                box-shadow: 0 10px 25px rgba(105, 104, 104, 0.382), 
              0 4px 12px rgba(0, 0, 0, 0.5);
                padding: 70px 15px;
                border-radius: 15px;
            background-color: rgb(253, 255, 255);}

            input[type="text"] {
                padding: 8px 8px;
                min-width: 90px;
                font-size: 20px;}
            .special{}
        </style>
    </head>
    <body>
        <div class="form"><div class="special"><p>Sign Up</p></div>
            <p>Create an account or <a href="">log in</a></p>
            <label for="email">Email:</label>
            <input type="text" id="username" name="user_email">
            <br>
            <br>
            <label for="password">Password:</label>
            <input type="text" id="text" name="user_password" class="second">
            <br>
            <br>
            <a href="">Sign In</a>
        </div>
        
    </body>
</html>
